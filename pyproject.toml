[project]
name = "wan"
version = "2.1.0"
description = "Wan2.1 for Mac."
authors = [
    { name = "Wan Team", email = "wan.ai@alibabacloud.com" },
    { name = "Bakhtiyor Sulaymonov", email = "bakhti.ai.uz@gmail.com" },
    { name = "HighDoping", email = "HighDoping@gmail.com" },
]
license = { file = "LICENSE.txt" }
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "torch>=2.4.0,<2.7",
    "torchvision>=0.19.0",
    "opencv-python>=4.9.0.80",
    "diffusers>=0.31.0",
    "transformers>=4.49.0",
    "tokenizers>=0.20.3",
    "accelerate>=1.1.1",
    "tqdm",
    "imageio",
    "easydict",
    "ftfy",
    "dashscope",
    "imageio-ffmpeg",
    "gradio>=5.0.0",
    "numpy>=1.23.5,<2",
    "einops",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8",
    "isort",
    "mypy",
    "huggingface-hub[cli]",
    "modelscope",
]

[project.urls]

repository = "https://github.com/Wan-Video/Wan2.1"

[tool.setuptools]
packages = ["wan"]

[tool.setuptools.package-data]
"wan" = ["**/*.py"]

[tool.black]
line-length = 88

[tool.isort]
profile = "black"

[tool.mypy]
strict = true
[tool.poetry.group.dev.dependencies]
yapf = "^0.43.0"
